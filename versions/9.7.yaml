# Percona Server 9.7 on Wolfi - product versions and pins.
# Flat "key: value" file. Researched 2026-11-13 (see docs/research.md for sources).

# --- Percona Server (github.com/percona/percona-server) ---
# VERIFY-BEFORE-RELEASE: official image is 9.7.2-3.1; re-check for a Percona-Server-9.7.2-3 tag
ps_tag: "Percona-Server-9.7.2-2"
ps_version: "9.7.2"
ps_release: "2"
# peeled commit of the tag (tag object d24a2a506b17...)
ps_commit: "91438a0430fbcd52dd85472edf3b357484484c22"
# "Revision" in COMPILATION_COMMENT / version_comment: first 8 hex digits of ps_commit (Percona's builder uses
# `git rev-parse --short HEAD`; the official 9.7.2-3 image reports an 8-digit "Revision 45d3d00f")
ps_revision: "91438a04"
# committer time of ps_commit: 2026-09-20T11:01:38Z
source_date_epoch: "1789902098"

# --- Hardening baseline for every compiled recipe (percona-server, percona-mysql-shell, percona-xtrabackup) ---
# Ruling R7: distro-style hardening (the official images are RHEL rpms built with redhat-rpm-config hardening).
# Added to each recipe's own CFLAGS/CXXFLAGS/LDFLAGS; -O/-g stay with CMAKE_BUILD_TYPE. -U first so a compiler
# built-in or inherited _FORTIFY_SOURCE level cannot clash (MySQL adds none: WITH_PACKAGE_FLAGS is off/undetected).
hardening_cflags: "-U_FORTIFY_SOURCE -D_FORTIFY_SOURCE=2 -fstack-protector-strong -fstack-clash-protection -fcf-protection -Wformat -Werror=format-security"
hardening_ldflags: "-Wl,-z,relro -Wl,-z,now"

# --- V8 (JS stored programs in the server; build_v8.sh in build-ps @ ps_tag) ---
v8_tag: "12.9.202.22"
# produced by scripts/vendor-v8.sh on the build host; cannot be known on the laptop
v8_src_sha256: "TODO-UNRESOLVED"

# --- MySQL Shell (upstream mysql/mysql-shell tag, built by Percona packaging) ---
# official image MYSQL_SHELL_VERSION (percona-mysql-shell rpm version-release)
mysqlsh_version: "9.7.1-2"
# upstream git tag (and commit ad74f712a312fa62bfc9e3c9c92a509369bca55e)
mysqlsh_tag: "9.7.1"
mysqlsh_commit: "ad74f712a312fa62bfc9e3c9c92a509369bca55e"
mysqlsh_src_url: "https://github.com/mysql/mysql-shell/archive/refs/tags/9.7.1.tar.gz"
mysqlsh_src_sha256: "dbafcad09acb50d203a64dd33e25b475dba40fc31c56d45de88f365b42b4fc04"
# mysql-shell 9.7.1 has no V8 dependency; JavaScript uses an optional prebuilt GraalVM
# polyglot "jit executor" library that Percona downloads (see docs/research.md section 1)
jit_executor_url: "https://downloads.percona.com/downloads/packaging/polyglot-nativeapi-native-library-lje_23.0.1_x86_64_el8.tar.gz"
jit_executor_sha256: "36153377bcb65a7b2fd65f0a25d658c5a6b56070f4959feb9344d55912e2e436"
# apk-legal form of mysqlsh_version (apk rejects "-"; same convention as percona-server: 9.7.1-2 -> 9.7.1.2)
mysqlsh_apk_version: "9.7.1.2"
# Python the shell embeds (HAVE_PYTHON=1, Wolfi python-<x.y>). Percona's el9 rpm (the official image) bundles 3.11.13.
mysqlsh_python: "3.11"
# ANTLR4 C++ runtime required by mysql-shell (not in Wolfi); Percona's builder builds tag 4.13.2 shared and bundles it
antlr4_version: "4.13.2"
antlr4_url: "https://github.com/antlr/antlr4/archive/refs/tags/4.13.2.tar.gz"
antlr4_sha256: "9f18272a9b32b622835a3365f850dd1063d60f5045fb1e12ce475ae6e18a35bb"

# --- Percona XtraBackup (github.com/percona/percona-xtrabackup) ---
pxb_tag: "percona-xtrabackup-9.7.2-2"
# peeled commit of the tag (tag object 06d530626d48...)
pxb_commit: "59328573fbbad763b20e0057f639634102f0a2f9"
# XB_VERSION at pxb_commit: 9.7.2 / XB_VERSION_EXTRA -2; apk version is pxb_version.pxb_release (9.7.2.2)
pxb_version: "9.7.2"
pxb_release: "2"
# "revision id" in `xtrabackup --version`: first 8 hex digits of pxb_commit (Percona builds from a `make dist` tarball,
# where cmake/mysql_version.cmake takes `cut -c 1-8` of the INFO_SRC commit; from git it is `rev-parse --short`)
pxb_revision: "59328573"
# Python of the Wolfi sphinx used to generate the man pages (-DWITH_MAN_PAGES=1 runs sphinx-build; no prebuilt pages in-tree)
pxb_sphinx_python: "3.13"

